name: daily

# Two things happen here every day:
#   1. every tool is executed for real (not just --help) against local fixtures,
#      so regressions surface without a human watching
#   2. the run leaves a dated entry in a rolling activity log
#
# Nothing is fabricated: the commit only lands when the tests actually passed.

on:
  schedule:
    - cron: '17 6 * * *'      # 06:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tool count
        id: count
        run: echo "n=$(ls tools/*.js | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Smoke test every tool
        id: smoke
        run: |
          set +e
          node smoke.js --deep > /tmp/smoke.txt 2>&1
          code=$?
          set -e
          tail -20 /tmp/smoke.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "summary=$(tail -1 /tmp/smoke.txt)" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Verify catalogue freshness
        run: |
          cp README.md /tmp/README.before
          node index-tools.js
          if ! diff -q /tmp/README.before README.md > /dev/null; then
            echo "::error::README catalogue drifted from tools/ — regenerate it"
            diff -u /tmp/README.before README.md | head -40
            exit 1
          fi

      - name: Verify metadata headers
        run: |
          bad=0
          for f in tools/*.js; do
            for tag in '@tool' '@desc' '@usage' '@tags'; do
              grep -q "^// *$tag " "$f" || { echo "::error file=$f::missing $tag"; bad=1; }
            done
          done
          [ "$bad" -eq 0 ] || exit 1

      - name: Record the run
        if: success()
        run: |
          mkdir -p activity
          day="$(date -u +%Y-%m-%d)"
          file="activity/${day}.md"
          {
            echo "# ${day}"
            echo
            echo "- tools verified: ${{ steps.count.outputs.n }}"
            echo "- smoke: ${{ steps.smoke.outputs.summary }}"
            echo "- node: $(node -v)"
            echo "- commit: ${GITHUB_SHA:0:10}"
            echo
          } > "$file"
          cat "$file"

      - name: Commit the log
        if: success()
        run: |
          git config user.name  "0xnothings"
          git config user.email "0xnothings@users.noreply.github.com"
          git add activity
          if git diff --staged --quiet; then
            echo "already recorded today — nothing to commit"
            exit 0
          fi
          git commit -m "chore(activity): $(date -u +%Y-%m-%d) — ${{ steps.count.outputs.n }} tools verified, smoke clean"
          git push

      - name: Summarise
        if: always()
        run: |
          {
            echo "### daily verification"
            echo
            echo "| field | value |"
            echo "|---|---|"
            echo "| tools | ${{ steps.count.outputs.n }} |"
            echo "| smoke | ${{ steps.smoke.outputs.summary }} |"
            echo "| node | $(node -v) |"
          } >> "$GITHUB_STEP_SUMMARY"
